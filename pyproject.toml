[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "justdocs"
version = "1.1.2"
description = "Reusable MkDocs custom theme with local search and dark mode."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "mkdocs>=1.6,<3",
    "packaging>=24",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: MkDocs",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Documentation",
]

[project.optional-dependencies]
release = [
    "build==1.6.1",
    "twine==7.0.0"
]

[project.urls]
Homepage = "https://github.com/FanaticPythoner/justdocs"
Repository = "https://github.com/FanaticPythoner/justdocs"
Issues = "https://github.com/FanaticPythoner/justdocs/issues"
Releases = "https://github.com/FanaticPythoner/justdocs/releases"
Changelog = "https://github.com/FanaticPythoner/justdocs/blob/main/CHANGELOG.md"

[project.scripts]
justdocs = "justdocs.cli:main"

[project.entry-points."mkdocs.themes"]
justdocs = "justdocs.theme"

[project.entry-points."mkdocs.plugins"]
justdocs-linker = "justdocs.plugins:JustdocsLinkerPlugin"

[tool.setuptools.packages.find]
include = ["justdocs*"]

[tool.setuptools.package-data]
justdocs = [
    "theme/404.html",
    "theme/base.html",
    "theme/mkdocs_theme.yml",
    "theme/main.html",
    "theme/assets/css/*.css",
    "theme/assets/js/*.js",
    "theme/assets/js/*.txt",
    "templates/*.Justfile",
]
