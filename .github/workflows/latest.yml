name: Latest

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latest-main
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      release_ref: ${{ steps.meta.outputs.release_ref }}
      release_sha: ${{ steps.meta.outputs.release_sha }}
      release_short_sha: ${{ steps.meta.outputs.release_short_sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          check-latest: true

      - name: Resolve latest release metadata
        id: meta
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: python -I scripts/release/release-source.py latest

  build:
    needs: preflight
    uses: ./.github/workflows/reusable-build-python-package.yml
    with:
      ref: ${{ needs.preflight.outputs.release_ref }}

  github-release:
    needs:
      - preflight
      - build
    runs-on: ubuntu-24.04
    concurrency:
      group: github-release-mutation-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: python-dist
          path: artifacts/release
          digest-mismatch: error

      - name: Set up release tooling
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          check-latest: true

      - name: Install release tooling
        run: python -m pip install 'packaging>=24'

      - name: Write release notes
        env:
          RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
        run: |
          bash scripts/release/write-release-notes.sh \
            --channel latest \
            --tag latest \
            --target "$RELEASE_SHA" \
            --target-branch main \
            --output artifacts/release-notes.md

      - name: Create or update latest GitHub release
        uses: ./.github/actions/release-assets
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          target_sha: ${{ needs.preflight.outputs.release_sha }}
          release_tag: latest
          release_name: Latest Nightly Build (${{ needs.preflight.outputs.release_short_sha }})
          prerelease: 'true'
          purge_existing_assets: 'true'
          create_or_move_tag: 'true'
          dist_dir: artifacts/release
          notes_file: artifacts/release-notes.md
