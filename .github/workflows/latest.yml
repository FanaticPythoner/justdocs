name: Latest

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latest-main
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      release_ref: ${{ steps.meta.outputs.release_ref }}
      release_sha: ${{ steps.meta.outputs.release_sha }}
      release_short_sha: ${{ steps.meta.outputs.release_short_sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          check-latest: true
          cache: pip

      - name: Resolve latest release metadata
        id: meta
        run: |
          git fetch --no-tags --force origin main:refs/remotes/origin/main
          release_sha="$(git rev-parse --verify 'refs/remotes/origin/main^{commit}')"
          if [[ "$(git rev-parse --verify 'HEAD^{commit}')" != "$release_sha" ]]; then
            echo 'checked-out source does not match origin/main' >&2
            exit 1
          fi
          {
            echo "release_ref=$release_sha"
            echo "release_sha=$release_sha"
            echo "release_short_sha=${release_sha:0:12}"
          } >> "$GITHUB_OUTPUT"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pymdown-extensions==10.12

      - name: Run test suite
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=. python -m unittest discover -s tests

  build:
    needs: preflight
    uses: ./.github/workflows/reusable-build-python-package.yml
    with:
      ref: ${{ needs.preflight.outputs.release_ref }}

  github-release:
    needs:
      - preflight
      - build
    runs-on: ubuntu-24.04
    concurrency:
      group: github-release-mutation-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.release_ref }}

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-dist
          path: artifacts/release
          digest-mismatch: error

      - name: Set up release tooling
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          check-latest: true
          cache: pip

      - name: Install release tooling
        run: python -m pip install 'packaging>=24'

      - name: Write release notes
        env:
          RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
        run: |
          bash scripts/release/write-release-notes.sh \
            --channel latest \
            --tag latest \
            --target "$RELEASE_SHA" \
            --target-branch main \
            --output artifacts/release-notes.md

      - name: Create or update latest GitHub release
        uses: ./.github/actions/release-assets
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          release_tag: latest
          release_name: Latest Nightly Build (${{ needs.preflight.outputs.release_short_sha }})
          prerelease: 'true'
          purge_existing_assets: 'true'
          create_or_move_tag: 'true'
          dist_dir: artifacts/release
          notes_file: artifacts/release-notes.md
