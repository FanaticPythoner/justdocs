name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: '3.10'
            build-dist: false
          - os: ubuntu-24.04
            python-version: '3.11'
            build-dist: false
          - os: ubuntu-24.04
            python-version: '3.12'
            build-dist: true
          - os: ubuntu-24.04
            python-version: '3.13'
            build-dist: false
          - os: ubuntu-24.04
            python-version: '3.13t'
            build-dist: false
          - os: ubuntu-24.04
            python-version: '3.14'
            build-dist: false
          - os: ubuntu-24.04
            python-version: '3.14t'
            build-dist: false
          - os: macos-15
            python-version: '3.14'
            build-dist: false
          - os: macos-15
            python-version: '3.14t'
            build-dist: false
          - os: windows-2025
            python-version: '3.14'
            build-dist: false
          - os: windows-2025
            python-version: '3.14t'
            build-dist: false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pymdown-extensions==10.12

      - name: Run test suite
        shell: bash
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=. python -m unittest discover -s tests

      - name: Build distributions
        if: matrix.build-dist
        id: dist
        uses: ./.github/actions/build-dist
        with:
          python_version: ${{ matrix.python-version }}

      - name: Upload distributions
        if: matrix.build-dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: justdocs-python-dist
          path: ${{ steps.dist.outputs.dist_dir }}/*
          if-no-files-found: error
          retention-days: 30
          archive: true
          overwrite: true

  artifact-roundtrip:
    needs: test-build
    runs-on: ubuntu-24.04

    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: justdocs-python-dist
          path: artifacts/release
          digest-mismatch: error

      - name: Verify artifact checksums
        working-directory: artifacts/release
        run: sha256sum --check SHA256SUMS.txt
