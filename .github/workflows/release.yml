name: Release

on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release, e.g. v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      release_ref: ${{ steps.meta.outputs.release_ref }}
      release_sha: ${{ steps.meta.outputs.release_sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          check-latest: true

      - name: Install publication tooling
        run: python -m pip install 'packaging>=24'

      - name: Resolve release metadata
        id: meta
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: bash scripts/release/resolve-release-metadata.sh

  build:
    needs: preflight
    uses: ./.github/workflows/reusable-build-python-package.yml
    with:
      ref: ${{ needs.preflight.outputs.release_ref }}

  publish:
    needs:
      - preflight
      - build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      pypi_published: ${{ steps.pypi_gate.outputs.published }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          check-latest: true

      - name: Install publication tooling
        run: python -m pip install 'packaging>=24'

      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: python-dist
          path: artifacts/release
          digest-mismatch: error

      - name: Inspect PyPI publication
        id: pypi_state
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          state="$(
            python scripts/release/check-pypi-artifacts.py \
              --package justdocs \
              --version "${RELEASE_TAG#v}" \
              --artifacts-dir artifacts/release \
              --stage-dir artifacts/pypi
          )"
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Resolve PyPI credentials
        id: pypi_gate
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          PYPI_STATE: ${{ steps.pypi_state.outputs.state }}
        run: |
          set -euo pipefail
          if [[ "$PYPI_STATE" == "exact" ]]; then
            publish=false
            published=true
            mode=existing
          elif [[ "$PYPI_STATE" != "absent" && "$PYPI_STATE" != "partial" ]]; then
            echo "invalid PyPI publication state '$PYPI_STATE'" >&2
            exit 2
          elif [[ -n "${PYPI_API_TOKEN:-}" ]]; then
            publish=true
            published=true
            mode=token
          else
            publish=true
            published=true
            mode=trusted
          fi
          {
            echo "publish=$publish"
            echo "published=$published"
            echo "mode=$mode"
          } >> "$GITHUB_OUTPUT"

      - name: Publish to PyPI with trusted publishing
        if: ${{ steps.pypi_gate.outputs.mode == 'trusted' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: artifacts/pypi
          skip-existing: false
          print-hash: true

      - name: Publish to PyPI with API token
        if: ${{ steps.pypi_gate.outputs.mode == 'token' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: artifacts/pypi
          skip-existing: false
          print-hash: true
          attestations: false

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            artifacts/release/*.whl
            artifacts/release/*.tar.gz

      - name: Record registry publication outcome
        if: always()
        env:
          PYPI_PUBLISHED: ${{ steps.pypi_gate.outputs.published }}
          PYPI_AUTHENTICATION: ${{ steps.pypi_gate.outputs.mode }}
        run: |
          {
            echo '## Registry publication'
            echo "- PyPI: $PYPI_PUBLISHED"
            echo "- Authentication: $PYPI_AUTHENTICATION"
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    needs:
      - preflight
      - publish
    runs-on: ubuntu-24.04
    concurrency:
      group: github-release-mutation-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: python-dist
          path: artifacts/release
          digest-mismatch: error

      - name: Set up release tooling
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          check-latest: true

      - name: Install release tooling
        run: python -m pip install 'packaging>=24'

      - name: Write release notes
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
        run: |
          bash scripts/release/write-release-notes.sh \
            --channel stable \
            --tag "$RELEASE_TAG" \
            --target "$RELEASE_SHA" \
            --output artifacts/release-notes.md

      - name: Create GitHub release
        uses: ./.github/actions/release-assets
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          target_sha: ${{ needs.preflight.outputs.release_sha }}
          release_tag: ${{ needs.preflight.outputs.tag }}
          release_name: justdocs ${{ needs.preflight.outputs.tag }}
          prerelease: ${{ needs.preflight.outputs.prerelease }}
          purge_existing_assets: 'true'
          create_or_move_tag: 'false'
          dist_dir: artifacts/release
          notes_file: artifacts/release-notes.md

  verify-pypi:
    needs:
      - preflight
      - publish
      - github-release
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          check-latest: true

      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: python-dist
          path: artifacts/release
          digest-mismatch: error

      - name: Install publication tooling
        run: python -m pip install 'packaging>=24'

      - name: Verify public PyPI publication
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: bash scripts/release/verify-pypi.sh

      - name: Write expected GitHub release notes
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
        run: |
          bash scripts/release/write-release-notes.sh \
            --channel stable \
            --tag "$RELEASE_TAG" \
            --target "$RELEASE_SHA" \
            --output artifacts/release-notes.md

      - name: Verify public GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
          RELEASE_PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        run: |
          python scripts/release/verify-github-release.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --target-sha "$RELEASE_SHA" \
            --release-name "justdocs $RELEASE_TAG" \
            --prerelease "$RELEASE_PRERELEASE" \
            --artifacts-dir artifacts/release \
            --notes-file artifacts/release-notes.md
