name: PR Python Distribution Comment

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions: {}

jobs:
  publish:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: write
    concurrency:
      group: pr-python-dist-comment-${{ github.event.workflow_run.pull_requests[0].number }}
      cancel-in-progress: false

    steps:
      - name: Check out trusted publisher
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          check-latest: true

      - name: Synchronize PR distribution comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci/sync-pr-python-dist-comment.py
