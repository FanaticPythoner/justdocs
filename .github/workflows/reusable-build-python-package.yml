name: Reusable Build Python Package

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build from.
        required: true
        type: string
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up source admission
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          check-latest: true

      - name: Export admitted build source
        id: source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ inputs.ref }}
        run: >-
          python -I scripts/release/release-source.py export
          --ref "$SOURCE_SHA" --directory release-source

      - name: Test admitted build source
        working-directory: release-source
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pymdown-extensions==10.12
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=. python -m unittest discover -s tests

      - name: Build distributions
        id: dist
        uses: ./.github/actions/build-dist
        with:
          python_version: '3.12'
          source_dir: release-source
        env:
          SOURCE_DATE_EPOCH: ${{ steps.source.outputs.source_date_epoch }}

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-dist
          path: ${{ steps.dist.outputs.dist_dir }}/*
          if-no-files-found: error
          archive: true
