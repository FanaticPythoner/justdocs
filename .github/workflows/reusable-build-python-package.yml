name: Reusable Build Python Package

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build from.
        required: true
        type: string
      release_tag:
        description: Stable release tag included in artifact metadata.
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Build distributions
        id: dist
        uses: ./.github/actions/build-dist
        with:
          python_version: '3.12'

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: ${{ steps.dist.outputs.dist_dir }}/*
          if-no-files-found: error
