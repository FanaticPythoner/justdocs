name: PR Python Distribution Lifecycle

on:
  pull_request_target:
    types:
      - closed

permissions: {}

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      pull-requests: write
    concurrency:
      group: pr-python-dist-comment-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      - name: Check out trusted publisher
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          check-latest: true

      - name: Remove closed PR distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/ci/sync-pr-python-dist-comment.py
          --closed-pull-request "${{ github.event.pull_request.number }}"
          --head-sha "${{ github.event.pull_request.head.sha }}"
