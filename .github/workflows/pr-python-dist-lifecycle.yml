name: PR Python Distribution Lifecycle

on:
  pull_request_target:
    types:
      - closed

permissions: {}

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      pull-requests: write
    concurrency:
      group: pr-python-dist-comment-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      - name: Check out trusted publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          check-latest: true

      - name: Remove closed PR distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/ci/sync-pr-python-dist-comment.py
          --closed-pull-request "${{ github.event.pull_request.number }}"
          --head-sha "${{ github.event.pull_request.head.sha }}"
