name: build-dist

description: Build sdist and universal wheel, then generate SHA256SUMS.txt.

inputs:
  python_version:
    description: Python version to use.
    required: false
    default: "3.12"
  source_dir:
    description: Admitted source directory relative to the workspace.
    required: false
    default: "."

outputs:
  dist_dir:
    description: Path to the built distributions.
    value: ${{ steps.out.outputs.dist_dir }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python_version }}
        check-latest: true

    - name: Build distributions
      shell: bash
      working-directory: ${{ inputs.source_dir }}
      env:
        BUILD_SCRIPT: ${{ github.action_path }}/../../../scripts/release/build-python-package.sh
      run: bash "$BUILD_SCRIPT"

    - id: out
      shell: bash
      env:
        SOURCE_DIR: ${{ inputs.source_dir }}
      run: echo "dist_dir=${SOURCE_DIR%/}/artifacts/release" >> "$GITHUB_OUTPUT"
