name: release-assets

description: Publish verified GitHub Release assets transactionally.

inputs:
  release_tag:
    required: true
    description: Release tag.
  release_name:
    required: true
    description: Release title.
  prerelease:
    required: true
    description: "true or false."
  purge_existing_assets:
    required: true
    description: "true or false."
  create_or_move_tag:
    required: true
    description: "true or false."
  dist_dir:
    required: false
    default: artifacts/release
    description: Directory with files to upload.
  notes_file:
    required: false
    default: ""
    description: Release notes file.

runs:
  using: composite
  steps:
    - name: Validate inputs
      id: validate
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.release_tag }}
        RELEASE_NAME: ${{ inputs.release_name }}
        PRERELEASE: ${{ inputs.prerelease }}
        PURGE_EXISTING_ASSETS: ${{ inputs.purge_existing_assets }}
        CREATE_OR_MOVE_TAG: ${{ inputs.create_or_move_tag }}
        DIST_DIR: ${{ inputs.dist_dir }}
        NOTES_FILE: ${{ inputs.notes_file }}
      run: |
        set -euo pipefail
        stage_root=''
        cleanup_failed_stage() {
          local stage_result="$?"
          local cleanup_result=0
          if [[ $stage_result -ne 0 && -n "$stage_root" ]]; then
            python3 scripts/release/stage-release-inputs.py cleanup \
              "$stage_root" "$RUNNER_TEMP" || cleanup_result=$?
          fi
          if [[ $cleanup_result -ne 0 ]]; then
            echo "release staging cleanup failed after result $stage_result" >&2
            exit 1
          fi
          exit "$stage_result"
        }
        trap cleanup_failed_stage EXIT
        source scripts/release/github-repository.sh
        release_validate_boolean prerelease "$PRERELEASE"
        release_validate_boolean purge_existing_assets "$PURGE_EXISTING_ASSETS"
        release_validate_boolean create_or_move_tag "$CREATE_OR_MOVE_TAG"
        # shellcheck disable=SC2153
        release_validate_tag "$RELEASE_TAG"
        # shellcheck disable=SC2153
        release_validate_name "$RELEASE_NAME"
        if [[ -z "$DIST_DIR" || "$DIST_DIR" == -* ]]; then
          echo "invalid dist_dir '$DIST_DIR': expected nonempty path without leading hyphen" >&2
          exit 2
        fi
        stage_root="$(
          python3 scripts/release/stage-release-inputs.py stage -- \
            "$DIST_DIR" "$NOTES_FILE" "$RUNNER_TEMP"
        )"
        staged_notes_file=''
        if [[ -n "$NOTES_FILE" ]]; then
          staged_notes_file="$stage_root/release-notes.md"
        fi
        {
          echo "stage_root=$stage_root"
          echo "dist_dir=$stage_root/assets"
          echo "notes_file=$staged_notes_file"
        } >> "$GITHUB_OUTPUT"
        trap - EXIT

    - name: Show inputs
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.release_tag }}
        RELEASE_NAME: ${{ inputs.release_name }}
        PRERELEASE: ${{ inputs.prerelease }}
        PURGE_EXISTING_ASSETS: ${{ inputs.purge_existing_assets }}
        CREATE_OR_MOVE_TAG: ${{ inputs.create_or_move_tag }}
        DIST_DIR: ${{ inputs.dist_dir }}
      run: |
        set -euo pipefail
        printf 'tag=%q\n' "$RELEASE_TAG"
        printf 'name=%q\n' "$RELEASE_NAME"
        printf 'prerelease=%q\n' "$PRERELEASE"
        printf 'purge=%q\n' "$PURGE_EXISTING_ASSETS"
        printf 'create_or_move_tag=%q\n' "$CREATE_OR_MOVE_TAG"
        printf 'dist_dir=%q\n' "$DIST_DIR"

    - name: Verify staged inputs
      shell: bash
      env:
        STAGE_ROOT: ${{ steps.validate.outputs.stage_root }}
      run: |
        set -euo pipefail
        python3 scripts/release/stage-release-inputs.py verify "$STAGE_ROOT"

    - name: Preflight release transaction
      id: transaction
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ inputs.release_tag }}
        CREATE_OR_MOVE_TAG: ${{ inputs.create_or_move_tag }}
      run: |
        set -euo pipefail
        transaction_root=''
        cleanup_failed_preflight() {
          local preflight_result="$?"
          local cleanup_result=0
          if [[ $preflight_result -ne 0 && -n "$transaction_root" ]]; then
            python3 scripts/release/transactional-github-release.py cleanup \
              "$transaction_root" "$RUNNER_TEMP" || cleanup_result=$?
          fi
          if [[ $cleanup_result -ne 0 ]]; then
            echo "release preflight cleanup failed after result $preflight_result" >&2
            exit 1
          fi
          exit "$preflight_result"
        }
        trap cleanup_failed_preflight EXIT
        target_sha="$(git rev-parse --verify 'HEAD^{commit}')"
        transaction_root="$(
          python3 scripts/release/transactional-github-release.py preflight \
            "$RELEASE_TAG" "$RUNNER_TEMP" "$CREATE_OR_MOVE_TAG" "$target_sha"
        )"
        echo "transaction_root=$transaction_root" >> "$GITHUB_OUTPUT"
        trap - EXIT

    - name: Publish release transaction
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_NAME: ${{ inputs.release_name }}
        PRERELEASE: ${{ inputs.prerelease }}
        PURGE_EXISTING_ASSETS: ${{ inputs.purge_existing_assets }}
        TRANSACTION_ROOT: ${{ steps.transaction.outputs.transaction_root }}
        NOTES_FILE: ${{ steps.validate.outputs.notes_file }}
        DIST_DIR: ${{ steps.validate.outputs.dist_dir }}
      run: |
        set -euo pipefail
        python3 scripts/release/transactional-github-release.py publish \
          "$TRANSACTION_ROOT" "$RELEASE_NAME" "$PRERELEASE" \
          "$NOTES_FILE" "$DIST_DIR" "$PURGE_EXISTING_ASSETS"

    - name: Cleanup release transaction
      if: always()
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TRANSACTION_ROOT: ${{ steps.transaction.outputs.transaction_root }}
        STAGE_ROOT: ${{ steps.validate.outputs.stage_root }}
      run: |
        set -euo pipefail
        transaction_result=0
        stage_result=0
        if [[ -n "$TRANSACTION_ROOT" ]]; then
          python3 scripts/release/transactional-github-release.py cleanup \
            "$TRANSACTION_ROOT" "$RUNNER_TEMP" || transaction_result=$?
        fi
        if [[ -n "$STAGE_ROOT" ]]; then
          python3 scripts/release/stage-release-inputs.py cleanup \
            "$STAGE_ROOT" "$RUNNER_TEMP" || stage_result=$?
        fi
        if [[ $transaction_result -ne 0 || $stage_result -ne 0 ]]; then
          echo "release cleanup failed: transaction=$transaction_result stage=$stage_result" >&2
          exit 1
        fi
